name: Windows Electron Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Windows runners invoke npm.cmd; cmd.exe reports its exit code correctly.
        shell: cmd
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npm run electron:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CynoPlanning-Windows-x64
          path: release/CynoPlanning-*-Setup.exe
          if-no-files-found: error
