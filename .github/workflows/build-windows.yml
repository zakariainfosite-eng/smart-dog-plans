name: Windows Electron Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare packager resources
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) {
            New-Item -ItemType File -Path .env -Force | Out-Null
          }

      - name: Build Windows x64 installer
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          CI: true
        run: npm run electron:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CynoPlanning-Windows-x64
          path: release/CynoPlanning-*-Setup.exe
          if-no-files-found: error
