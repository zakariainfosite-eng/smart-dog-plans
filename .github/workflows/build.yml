name: Build Windows EXE

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS EXE
        # Build only; never publish a GitHub Release via electron-builder.
        # Clear tokens so electron-builder cannot authenticate a publish even if misconfigured.
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npm run electron:build:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CynoPlanning-Windows
          path: release/**/*.exe
          if-no-files-found: error
