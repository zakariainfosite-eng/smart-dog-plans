name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Confirm Windows x64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Runner is not AMD64/x64: $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite native module for Electron
        run: npm run electron:rebuild-native

      - name: Build web application
        run: npm run build:web

      - name: Build Electron main process
        run: npm run electron:build:main

      - name: Verify SQLite update safety
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/verify-sqlite-migrations.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install electron scripts/verify-sqlite-upgrade-from-legacy.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows NSIS x64 EXE
        # Build only; never publish a GitHub Release via electron-builder.
        # Clear tokens so electron-builder cannot authenticate a publish even if misconfigured.
        # --x64 forces Intel/AMD Windows (not ARM64), suitable for normal PCs.
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: npm run electron:build:win -- --x64

      - name: Verify NSIS x64 installer artifact
        shell: pwsh
        run: |
          if (Test-Path "release/win-arm64-unpacked") {
            throw "ARM64 unpacked directory was produced; expected x64 only."
          }

          $unpacked = Get-Item "release/win-unpacked/CynoPlanning.exe" -ErrorAction Stop
          $fs = [IO.File]::OpenRead($unpacked.FullName)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $pe = $br.ReadInt32()
          $fs.Seek($pe + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close()
          if ($machine -ne 0x8664) {
            throw "CynoPlanning.exe is not AMD64/x64. PE machine=0x$($machine.ToString('X'))"
          }

          $installers = @(Get-ChildItem -Path release -Filter "CynoPlanning-*-Setup.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No CynoPlanning NSIS setup executable was generated."
          }
          $installers | ForEach-Object {
            Write-Host "Installer: $($_.FullName) ($($_.Length) bytes) Windows x64 (AMD64)"
          }
          Write-Host "Verified unpacked app: $($unpacked.FullName) machine=AMD64"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CynoPlanning-Windows-x64
          path: release/CynoPlanning-*-Setup.exe
          if-no-files-found: error
